name: ecommerce-api
description: Example intentionally vulnerable architecture for local evaluation.
components:
  - name: frontend
    type: web
    internet_facing: true
  - name: api
    type: backend
    internet_facing: true
    authentication: oauth2
    authorization: tenant-and-resource-policy
    audit_logging: true
  - name: database
    type: postgres
    sensitive_data: true
connections:
  - frontend -> api
  - source: api
    target: database
    protocol: tls
    data_types:
      - customer data
      - payment data
    encrypted: true
